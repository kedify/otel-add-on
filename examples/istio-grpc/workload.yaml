            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: app
              mountPath: /app
              readOnly: true
            - name: runtime
              mountPath: /runtime
              readOnly: true
      volumes:
        - name: app
