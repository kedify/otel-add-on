# Source: kedify/github-meta/.github/workflows/kubernetes-versions.yml
# Update this source first, then refresh public copies as for the backup template.
# Public copies use the local updater script instead of the shared checkout.

name: Rotate Kubernetes CI versions

on:
  workflow_call:
    inputs:
      manifest:
        description: Pinned Kubernetes JSON manifest relative to the repository root
        required: true
        type: string
      count:
        description: Number of recent Kubernetes minors (1 or 3)
        required: true
        type: number
      labels:
        description: Optional comma-separated labels required to enable the caller's PR checks
        type: string
        default: ''
      base-branch:
        description: Development branch to update; defaults to the repository's default branch
        type: string
        default: ''
      sync-command:
        description: Optional trusted base-branch command to align support declarations after rotation
        type: string
        default: ''
      sync-paths:
        description: Newline-separated tracked files that the sync command may update, in addition to the manifest
        type: string
        default: ''
    secrets:
      GH_PAT:
        description: KedifyBot PAT with contents and pull request write access so PR checks run
        required: true

permissions: {}

concurrency:
  group: kubernetes-versions-${{ github.repository }}
  cancel-in-progress: false

jobs:
  rotate:
    if: github.repository_owner == 'kedify' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GH_PAT }}
      MANIFEST: ${{ inputs.manifest }}
      COUNT: ${{ inputs.count }}
      LABELS: ${{ inputs.labels }}
      BASE: ${{ inputs.base-branch || github.event.repository.default_branch }}
      SYNC_COMMAND: ${{ inputs.sync-command }}
      SYNC_PATHS: ${{ inputs.sync-paths }}
    steps:
      - name: Checkout target repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.BASE }}
          token: ${{ secrets.GH_PAT }}
          path: target
          fetch-depth: 0
      - name: Resolve upstream and provider versions
        working-directory: target
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/kubernetes-versions.md"
          if python3 .github/scripts/rotate_kubernetes.py "$MANIFEST" --count "$COUNT" > "$body" 2>&1; then
            cat "$body" >> "$GITHUB_STEP_SUMMARY"
          else
            tee -a "$GITHUB_STEP_SUMMARY" < "$body"
            exit 1
          fi
      - name: Propose CI version window
        working-directory: target
        run: |
          set -euo pipefail
          paths_file="$RUNNER_TEMP/kubernetes-sync-paths"
          python3 - <<'PY' > "$paths_file"
          import os
          from pathlib import Path
          root = Path.cwd()
          declared = [os.environ["MANIFEST"], *os.environ.get("SYNC_PATHS", "").splitlines()]
          paths = []
          for value in declared:
              if not value.strip():
                  continue
              path = Path(value.strip())
              if path.is_absolute() or any(char in value for char in "*?["):
                  raise ValueError("sync paths must be literal repository-relative files")
              name = str(path.resolve().relative_to(root))
              if name.startswith(":"):
                  raise ValueError("sync paths must be literal repository-relative files")
              if not (root / name).is_file():
                  raise ValueError(f"sync path is not an existing file: {name}")
              if name not in paths:
                  paths.append(name)
          print("\n".join(paths))
          PY
          mapfile -t paths < "$paths_file"
          for path in "${paths[@]}"; do git ls-files --error-unmatch -- "$path" >/dev/null; done
          if [[ -n "${SYNC_COMMAND:-}" ]]; then
            bash -euo pipefail -c "$SYNC_COMMAND" | tee -a "$RUNNER_TEMP/kubernetes-versions.md" "$GITHUB_STEP_SUMMARY"
          fi
          while IFS= read -r -d '' path; do
            if ! grep -Fxq -- "$path" "$paths_file"; then
              echo "The updater changed an undeclared file: $path" >&2
              exit 1
            fi
          done < <(git diff HEAD --name-only -z)
          if [[ -n "$(git ls-files --others --exclude-standard)" ]]; then
            echo "The updater created undeclared files; stopping before commit." >&2
            exit 1
          fi
          if git diff HEAD --quiet -- "${paths[@]}"; then exit 0; fi
          branch=automation/kubernetes-versions
          old_sha="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
          if [[ -n "$old_sha" ]]; then
            git fetch origin "$branch"
            branch_files="$(git diff --name-only "HEAD...$old_sha")"
            if git log --format='%ae%n%ce' "HEAD..$old_sha" | grep -Fvx 'kedifybot@kedify.io' >/dev/null; then
              echo "The automation branch has other edits; review it before rerunning." >&2
              exit 1
            fi
            while IFS= read -r path; do
              if [[ -n "$path" ]] && ! grep -Fxq -- "$path" "$paths_file"; then
                echo "The automation branch has edits outside the declared files: $path" >&2
                exit 1
              fi
            done <<< "$branch_files"
          fi
          if [[ -z "$old_sha" ]] || ! git merge-base --is-ancestor HEAD "$old_sha" ||
             ! git diff --quiet "$old_sha" -- "${paths[@]}"; then
            git switch -c "$branch"
            git config user.name 'Kedify Bot'
            git config user.email kedifybot@kedify.io
            git add -- "${paths[@]}"
            git commit -s -m 'ci: rotate Kubernetes compatibility versions'
            git push --force-with-lease="refs/heads/$branch:$old_sha" origin "HEAD:refs/heads/$branch"
          fi
          if [[ -n "${SYNC_COMMAND:-}" ]]; then
            {
              echo
              echo "Support declarations synchronized in this PR:"
              sed 's/^/- /' "$paths_file"
            } >> "$RUNNER_TEMP/kubernetes-versions.md"
          fi
          pr="$(gh pr list --head "$branch" --base "$BASE" --state open --json number --jq '.[0].number // empty')"
          version_label="$(gh label list --search version-bump --json name --jq '.[] | select(.name == "version-bump") | .name')"
          if [[ -z "$version_label" ]]; then
            gh label create version-bump --color 1d76db --description 'Automated version updates'
          fi
          label_flag=--label
          if [[ -n "$pr" ]]; then label_flag=--add-label; fi
          label_args=("$label_flag" "version-bump${LABELS:+,$LABELS}")
          if [[ -n "$pr" ]]; then
            gh pr edit "$pr" --body-file "$RUNNER_TEMP/kubernetes-versions.md" "${label_args[@]}"
          else
            gh pr create --head "$branch" --base "$BASE" --title 'ci: rotate Kubernetes compatibility versions' \
              --body-file "$RUNNER_TEMP/kubernetes-versions.md" "${label_args[@]}"
          fi
