{{- $ha := .Values.settings.ha | default dict -}}
{{- range $i, $c := include "operatorCrs" . | fromJsonArray }}
{{- if $c.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $c.name | default $.Values.fullnameOverride | default (printf "%s-%d" $.Release.Name $i) }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/hook: "post-install,post-upgrade"
    helm.sh/hook-delete-policy: "before-hook-creation,hook-succeeded"
    helm.sh/hook-weight: "-2"
data:
  content: |
    apiVersion: opentelemetry.io/v1beta1
    kind: OpenTelemetryCollector
    metadata:
      name: {{ $c.name | default $.Values.fullnameOverride | default (printf "%s-%d" $.Release.Name $i) }}
      {{- if $c.targetAllocatorEnabled }}
      namespace: {{ default $.Release.Namespace }}
      {{- else }}
      namespace: {{ $c.namespace | default $.Release.Namespace }}
      {{- end }}
      labels:
        meta.helm.sh/release-name: {{ $.Release.Name }}
        helm.sh/chart: {{ $.Chart.Version }}
    spec:
      resources:
        {{- toYaml $c.resources | nindent 8 }}
      {{- if and $c.targetAllocatorEnabled (eq $c.mode "sidecar") }}
      mode: statefulset
      {{- else }}
      mode: {{ $c.mode }}
      {{- end}}
      {{- with ($c.serviceAccount).name }}
      serviceAccount: {{ . }}
      {{- end }}
      upgradeStrategy: none
      {{- with $c.env }}
      env:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.envFrom }}
      envFrom:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $c.imagePullPolicy }}
      imagePullPolicy: {{ . }}
      {{- end }}

      {{- if $c.targetAllocatorEnabled }}
      targetAllocator:
        {{- toYaml $c.targetAllocator | nindent 8 }}
      {{- end }}
      volumes:
      {{- range ($c.tls).secrets }}
        - name: {{ .name }}
          secret:
            defaultMode: 420
            secretName: {{ .name }}
      {{- end }}
      {{- with $c.volumes }}
        {{- toYaml . | nindent 8 -}}
      {{- end }}
      volumeMounts:
      {{- range ($c.tls).secrets }}
        - mountPath: {{ .mountPath }}
          name: {{ .name }}
          readOnly: true
      {{- end }}
      {{- with $c.volumeMounts }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- range list "volumeClaimTemplates" "lifecycle" "nodeSelector" "podAnnotations" "podSecurityContext" "securityContext" "topologySpreadConstraints" "tolerations" }}
      {{ . }}:
        {{- toYaml (get $c .) | nindent 8 -}}
      {{- end }}

      config:
        {{- if $c.alternateOtelConfig }}
        {{- if $ha.enabled }}
        {{- include "otel-add-on.haCollectorConfig" (dict "root" $ "config" $c.alternateOtelConfig "exporter" "otlp/keda") | nindent 8 }}
        {{- else }}
        {{- toYaml $c.alternateOtelConfig | nindent 8 }}
        {{- end }}
        {{- else}}

        {{- $extensions := list }}
        {{- with $c.alternateExtensions }}
        extensions:
        {{- range $extension, $extensionCfg := . }}
          {{- $extensions = append $extensions $extension }}
          {{ $extension }}:
            {{- toYaml $extensionCfg | nindent 12 }}
        {{- end }}
        {{- end }}

        {{- $receivers := list }}
        receivers:
        {{- if $c.alternateReceivers }}
        {{- range $receiver, $receiverCfg := $c.alternateReceivers }}
          {{- $receivers = append $receivers $receiver }}
          {{ $receiver }}:
            {{- toYaml $receiverCfg | nindent 12 }}
        {{- end }}
        {{- else}}
        {{- if or $c.targetAllocatorEnabled $c.prometheusScrapeConfigs }}
          prometheus:
            config:
              scrape_configs:
        {{- $receivers = append $receivers "prometheus" }}
        {{- if $c.targetAllocatorEnabled }}
              - job_name: 'otel-collector'
                scrape_interval: 10s
                static_configs:
                - targets: [ '0.0.0.0:8888' ]
                metric_relabel_configs:
                - action: labeldrop
                  regex: (id|name)
                - action: labelmap
                  regex: label_(.+)
                  replacement: $$1
        {{- else }}
        {{- with $c.prometheusScrapeConfigs }}
              {{- toYaml . | nindent 14 }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- $processors := list }}
        processors:
          {{- $processors = append $processors "resourcedetection/env" }}
          resourcedetection/env:
            detectors: [env]
            timeout: 2s
            override: false

          {{- $processors = append $processors "transform" }}
          transform:
            metric_statements:
              - context: datapoint
                statements:
                  - set(attributes["namespace"], resource.attributes["k8s.namespace.name"])
                  - set(attributes["pod"], resource.attributes["k8s.pod.name"])
                  - set(attributes["deployment"], resource.attributes["k8s.deployment.name"])

          {{- with $c.includeMetrics}}
          {{- $processors = append $processors "filter/metrics" }}
          filter/metrics:
            metrics:
              include:
                match_type: strict
                metric_names:
                  {{- range . }}
                  - {{ . }}
                  {{- end }}
          {{- end }}

          {{- with ($c.metricsgeneration).rules }}
          {{- $processors = append $processors "metricsgeneration" }}
          metricsgeneration:
            rules:
              {{- toYaml . | nindent 14 }}
          {{- end }}
        {{- $exporters := list }}
        exporters:
        {{- if $c.alternateExporters }}
        {{- $custom := dict "exporters" $c.alternateExporters "service" (dict "pipelines" (dict "metrics" (dict "exporters" (keys $c.alternateExporters | sortAlpha)))) }}
        {{- if $ha.enabled }}
        {{- $_ := set $custom.service "pipelines" ($c.alternatePipelines | default $custom.service.pipelines) }}
        {{- $custom = include "otel-add-on.haCollectorConfig" (dict "root" $ "config" $custom "exporter" "otlp/keda") | fromYaml }}
        {{- end }}
        {{- range $exporter, $exporterCfg := $custom.exporters }}
          {{- $exporters = append $exporters $exporter }}
          {{ $exporter }}:
            {{- toYaml $exporterCfg | nindent 12 }}
        {{- end }}
        {{- else}}
          {{- $ordinals := list -1 }}
          {{- if $ha.enabled }}
          {{- $ordinals = until (int ($ha.replicas | default 3)) }}
          {{- end }}
          {{- range $ordinal := $ordinals }}
          {{- $name := "otlp/keda" }}
          {{- if $ha.enabled }}
          {{- $name = printf "otlp/keda-%d" $ordinal }}
          {{- end }}
          {{- $exporters = append $exporters $name }}
          {{ $name }}:
            {{- if $ha.enabled }}
            endpoint: {{ include "otel-add-on.replicaEndpoint" (dict "root" $ "ordinal" $ordinal) }}
            sending_queue:
              enabled: true
              wait_for_result: false
              block_on_overflow: false
            retry_on_failure:
              enabled: true
            {{- else }}
            endpoint: {{ $.Values.service.name | default $.Values.fullnameOverride | default $.Release.Name }}.{{ $.Values.namespace | default $.Release.Namespace }}.svc:4317
            {{- end }}
            compression: "none"
            tls:
              {{- if or ($c.tls).caFile (and ($c.tls).certFile ($c.tls).keyFile) }}
              insecure: false
              {{- if and $ha.enabled (not (hasKey ($c.tls.extraSettings | default dict) "server_name_override")) }}
              server_name_override: {{ $.Values.service.name | default $.Values.fullnameOverride | default $.Release.Name }}.{{ $.Values.namespace | default $.Release.Namespace }}.svc
              {{- end }}
                {{- if not $c.tls.caFile }}
              insecure_skip_verify: true
                {{- else }}
              ca_file: {{ $c.tls.caFile }}
                {{- end }}
              cert_file: {{ $c.tls.certFile }}
              key_file: {{ $c.tls.keyFile }}
              {{- with $c.tls.extraSettings }}
              {{- toYaml . | nindent 14 }}
              {{- end }}
              {{- else }}
              insecure: true
              {{- end }}
          {{- end }}
          {{- if $c.debug }}
          {{- $exporters = append $exporters "debug" }}
          debug:
            verbosity: detailed
          {{- end }}
        {{- end }}

        {{- $connectors := list }}
        {{- with $c.alternateConnectors }}
        connectors:
        {{- range $connector, $connectorCfg := . }}
          {{- $connectors = append $connectors $connector }}
          {{ $connector }}:
            {{- toYaml $connectorCfg | nindent 12 }}
        {{- end }}
        {{- end }}

        service:
          {{- with $extensions }}
          extensions: [{{- join "," . -}}]
          {{- end }}
          pipelines:
            {{- if $c.alternatePipelines }}
            {{- if $ha.enabled }}
            {{- $pipelineConfig := dict "exporters" (dict "otlp/keda" (dict "compression" "none")) "service" (dict "pipelines" $c.alternatePipelines) }}
            {{- $pipelineConfig = include "otel-add-on.haCollectorConfig" (dict "root" $ "config" $pipelineConfig "exporter" "otlp/keda") | fromYaml }}
            {{- toYaml $pipelineConfig.service.pipelines | nindent 12 }}
            {{- else }}
            {{- toYaml $c.alternatePipelines | nindent 12 }}
            {{- end }}
            {{- else}}
            metrics:
              receivers: [{{- join "," $receivers -}}]
              processors: [{{- join "," $processors -}}]
              exporters: [{{- join "," $exporters -}}]
            {{- end }}
        {{- end }}
---
{{- end }}
{{- end }}
