# helm upgrade -i keda-otel helmchart/otel-add-on/ --set image.repository=docker.io/jkremser/otel-add-on --set image.tag=latest

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: otel-example
spec:
  scaleTargetRef:
    name: nodeapp
  triggers:
    - type: external
      metadata:
        scalerAddress: "keda-otel-scaler.keda.svc:4318"
#        scalerAddress: "host.k3d.internal:4318"

        # required - no default
        # PromQL-like expression: apply operationOverTime to each series first,
        # then evaluate arithmetic/functions, then sum the final vector implicitly.
        # Use sum, min, max, avg, or count for explicit (and nested) aggregation.
        # Functions: ln(vector), log2(vector), scalar(vector), vector(scalar), clamp_min(vector, scalar), clamp_max(vector, scalar).
        # Operators: +, -, *, /, %, ^, or; unary +/-, parentheses, and multiline whitespace.
        # Explicit zero fallback for an optional metric: sum(optional_metric) or vector(0).
        # Stored metric names normalize '.', '/', and '-' to '_'.
        # Label matchers support =, !=, =~, !~ and repeated constraints.
        #
        # examples:
        #  - avg(http_requests_total{code=200,handler=targets,instance=example:8080,method=get})   (good with operationOverTime=rate)
        #  - up{instance=prod:8080}
        #  - foobar
        #  - max(clamp_min(log2(queue_depth + 1), 1))
        #  - messages_ready / consumer_count (only matching label sets are combined)
        metricQuery: "avg(http_server_request_count{app_id=nodeapp, method=GET, path=/v1.0/state/statestore})"

        targetValue: "5"

        # optional - default no limit
        # lower integer bound for the value calculated by the scaler (~min replicas)
        clampMin: "0"

        # optional - default no limit
        # upper integer bound for the value calculated by the scaler (~max replicas)
        clampMax: "10"

        # optional - default 'last_one', available values:
        #    example metric   t1   t2   t3   t4   t5   t6   t7        result
        #   - last_one  ...   3    2    1    6    3    2    3    ->   3
        #   - min       ...   3    2    1    6    3    2    3    ->   1
        #   - max       ...   3    2    1    6    3    2    3    ->   6
        #   - avg       ...   3    2    1    6    3    2    3    ->   round(20/7)=7
        #   - rate      ...   1    2    3    4    5    6    7    ->   1 (provided, measurements were taken each second)
        #   - count     ...   3    2    1    6    3    2    3    ->   7
        operationOverTime: "rate"
  # for faster reaction - debug
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 10
        scaleUp:
          stabilizationWindowSeconds: 10
