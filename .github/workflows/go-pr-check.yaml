name: 'PR checks'
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, unlabeled]
    paths-ignore:
      - '**.md'

jobs:
  go-build-test:
    permissions:
      contents: read  # for actions/checkout to fetch code
      pull-requests: read  # for golangci/golangci-lint-action to fetch pull requests
      checks: write  # Optional: Allow write access to checks to allow the golangci/golangci-lint-action to annotate code in the PR (SARIF)

    name: Inspect packages
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') && (github.event.action != 'unlabeled' || github.event.label.name == 'skip-ci') }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify dependencies
        run: |
          tidy_with_retry() {
            go mod tidy || { sleep 5 && go mod tidy; }
          }

          go mod verify
          tidy_with_retry
          (cd e2e-tests && go mod verify && tidy_with_retry)
          gofmt -s -w .
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "dirty repository"
            git status
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          skip-cache: true

      - name: Run staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.2
          staticcheck ./...

      - name: Run vulncheck
        continue-on-error: true
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          printf '### vulncheck\n\n```\n' >> "$GITHUB_STEP_SUMMARY"
          scan_exit=0
          for module in . e2e-tests; do
            (cd "$module" && govulncheck ./...) 2>&1 | tee -a "$GITHUB_STEP_SUMMARY" || scan_exit=$?
          done
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$scan_exit"

      - name: Build
        env:
          CGO_ENABLED: 0
        run: make build

      - name: Test
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm dependency build helmchart/otel-add-on
          make test

  build-and-publish-images:
    needs: [ go-build-test ]
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') && (github.event.action != 'unlabeled' || github.event.label.name == 'skip-ci') }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
    uses: ./.github/workflows/release-image.yaml
    with:
      tag: pr-${{ github.event.pull_request.number }}
      releaseWithGoReleaser: false

  run-e2e-tests:
    needs: [ build-and-publish-images ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') && (github.event.action != 'unlabeled' || github.event.label.name == 'skip-ci') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: e2e-tests/go.mod
          cache-dependency-path: e2e-tests/go.sum
      - name: Select Kubernetes version
        id: kubernetes
        run: |
          image=$(jq -er 'if length == 1 then .[0] else error("expected one Kubernetes image") end' e2e-tests/kubernetes-versions.json)
          tag="${image%@*}"
          tag="${tag##*:}"
          echo "kubectl=${tag%-k3s*}" >> "$GITHUB_OUTPUT"
      - uses: marcofranssen/setup-kubectl@v2.0.0
        with:
          kubectlVersion: ${{ steps.kubernetes.outputs.kubectl }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.pull_request.head.repo.full_name != github.repository
        with:
          name: otel-scaler-image
          path: ${{ runner.temp }}
      - name: Run the end to end tests
        env:
          OTEL_SCALER_ARCHIVE: ${{ github.event.pull_request.head.repo.full_name != github.repository && format('{0}/otel-scaler.tar', runner.temp) || '' }}
          OTEL_SCALER_VERSION: pr-${{ github.event.pull_request.number }}
          PR_BRANCH: ${{ github.head_ref }}
          GH_PAT: ${{ secrets.GITHUB_TOKEN }}
          E2E_PRINT_LOGS: "true"
        run: make e2e-test

  run-ha-e2e-tests:
    name: HA end-to-end tests
    needs: [ build-and-publish-images ]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-ci') && (github.event.action != 'unlabeled' || github.event.label.name == 'skip-ci') }}
    steps:
      - uses: actions/checkout@v4
      - name: Install k3d and hey
        run: |
          curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.8.3/k3d-linux-amd64 -o "$RUNNER_TEMP/k3d"
          sudo install -m 0755 "$RUNNER_TEMP/k3d" /usr/local/bin/k3d
          sudo apt-get update
          sudo apt-get install -y hey
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: github.event.pull_request.head.repo.full_name != github.repository
        with:
          name: otel-scaler-image
          path: ${{ runner.temp }}
      - name: Test scaler failover and replica changes
        env:
          OTEL_SCALER_ARCHIVE: ${{ github.event.pull_request.head.repo.full_name != github.repository && format('{0}/otel-scaler.tar', runner.temp) || '' }}
          OTEL_SCALER_VERSION: pr-${{ github.event.pull_request.number }}
        run: bash e2e-tests/test-ha.sh
