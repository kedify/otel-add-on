name: Kedifybot review

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, review_requested, edited]

permissions:
  actions: read
  pull-requests: read

jobs:
  review:
    if: >-
      (github.event.action != 'edited' || github.event.changes.base.ref.from != null) &&
      (github.event.action != 'review_requested' || github.event.requested_reviewer.id == 153312683)
    concurrency:
      group: kedifybot-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # This job reads GitHub metadata. It never checks out a repository.
      - name: Authorize review
        id: gate
        env:
          KEDIFY_PUBLIC_REPO_REVIEW_GITHUB_TOKEN: ${{ github.token }}
          KEDIFY_PUBLIC_REPO_REVIEW_TEAM_IDS: ${{ secrets.KEDIFY_PUBLIC_REPO_REVIEW_TEAM_IDS }}
        run: |
          set -euo pipefail
          bot=153312683
          repo=$GITHUB_REPOSITORY
          [[ $repo =~ ^kedify/[A-Za-z0-9_.-]+$ ]] || exit 0
          team_ids=$KEDIFY_PUBLIC_REPO_REVIEW_TEAM_IDS
          if [[ -z $team_ids ]]; then
            echo '::warning::The Kedify public review roster is unavailable for this run.'
            exit 0
          fi

          github_api() {
            GH_TOKEN="$KEDIFY_PUBLIC_REPO_REVIEW_GITHUB_TOKEN" gh api "$@"
          }

          action=$(jq -er '.action' "$GITHUB_EVENT_PATH")
          pr=$(jq -er '.number' "$GITHUB_EVENT_PATH")
          head=$(jq -er '.pull_request.head.sha' "$GITHUB_EVENT_PATH")
          base_ref=$(jq -er '.pull_request.base.ref | select(type == "string" and length > 0)' "$GITHUB_EVENT_PATH")
          [[ $pr =~ ^[1-9][0-9]*$ && $head =~ ^[0-9a-f]{40}$ ]] || exit 1
          transition=
          case "$action" in
            reopened|ready_for_review) transition=$action ;;
            edited)
              jq -e --arg base "$base_ref" '
                .changes.base.ref.from | type == "string" and length > 0 and . != $base
              ' "$GITHUB_EVENT_PATH" >/dev/null || exit 0
              transition=base_ref_changed
              action=synchronize
              ;;
            opened|synchronize|review_requested) ;;
            *) exit 0 ;;
          esac
          jq -e 'type == "array" and length > 0 and all(.[]; type == "number" and . > 0 and floor == .)' \
            <<< "$team_ids" >/dev/null

          matches_pr() {
            jq -e --arg repo "$repo" --arg head "$head" --arg base "$base_ref" '
              .base.repo.full_name == $repo and .base.repo.visibility == "public" and
              .state == "open" and .draft == false and .head.sha == $head and .base.ref == $base
            ' >/dev/null
          }
          current=$(github_api "repos/$repo/pulls/$pr")
          matches_pr <<< "$current" || exit 0

          author=$(jq -er '.user.id' <<< "$current")
          [[ "$author" != "$bot" ]] || exit 0
          request_id=
          team_author=$(jq -r --argjson id "$author" 'index($id) != null' <<< "$team_ids")
          if [[ "$team_author" == true ]]; then
            [[ $action != review_requested ]] || exit 0
          elif [[ $action == review_requested ]]; then
            jq -e --argjson team "$team_ids" --argjson bot "$bot" '
              .sender.id as $sender | .requested_reviewer.id == $bot and ($team | index($sender) != null)
            ' "$GITHUB_EVENT_PATH" >/dev/null || exit 0
          fi

          for delay in 0 5 10 15; do
            if (( delay > 0 )); then
              sleep "$delay"
              current=$(github_api "repos/$repo/pulls/$pr")
              matches_pr <<< "$current" || exit 0
            fi
            if [[ "$action" == review_requested ]]; then
              jq -e --argjson bot "$bot" 'any(.requested_reviewers[]?; .id == $bot)' \
                <<< "$current" >/dev/null || exit 0
            fi
            events=$(github_api --paginate --slurp "repos/$repo/issues/$pr/timeline?per_page=100")
            if [[ "$team_author" != true ]]; then
              if ! request_id=$(jq -er --argjson team "$team_ids" --argjson bot "$bot" '
                [.[][] | select(.requested_reviewer.id == $bot) | .review_requester.id as $requester |
                  select(.event == "review_request_removed" or
                    (.event == "review_requested" and ($team | index($requester) != null)))] |
                last | select(.event == "review_requested") | .node_id |
                select(type == "string" and length > 0)
              ' <<< "$events"); then
                [[ "$action" == review_requested ]] || exit 0
                (( delay < 15 )) && continue
                echo '::error::The active review request did not appear in the timeline after 30 seconds. Rerun once it appears.'
                exit 1
              fi
            fi

            lifecycle=$(jq -c '
              [.[][] | select(.event | IN("ready_for_review", "reopened", "base_ref_changed", "convert_to_draft", "closed"))] | last
            ' <<< "$events")
            # Allow for GitHub updating the PR row just after recording the transition.
            if [[ -z "$transition" ]] || jq -e --arg type "$transition" \
              --slurpfile event "$GITHUB_EVENT_PATH" '
                def epoch: try fromdateiso8601 catch 0;
                .event == $type and .actor.id == $event[0].sender.id and
                  (.created_at | epoch) >= (($event[0].pull_request.updated_at | epoch) - 15)
              ' <<< "$lifecycle" >/dev/null; then
              break
            fi
            if (( delay == 15 )); then
              echo '::error::The latest PR transition did not match the trigger after 30 seconds. Rerun once it appears in the timeline.'
              exit 1
            fi
          done
          lifecycle_id=$(jq -c '.node_id' <<< "$lifecycle")

          retarget=$(jq -c '[.[][] | select(.event == "base_ref_changed")] | last' <<< "$events")
          retarget_id=$(jq -r '.node_id // ""' <<< "$retarget")
          retarget_at=$(jq -r '.created_at // ""' <<< "$retarget")
          base_key=$(printf '%s\0%s' "$base_ref" "$retarget_id" | sha256sum)
          base_key=${base_key%% *}
          marker="<!-- kedifybot:public-review:$head:$base_key -->"
          legacy_marker="<!-- kedifybot:public-review:$head -->"
          reviews=$(github_api --paginate --slurp "repos/$repo/pulls/$pr/reviews?per_page=100")
          jq -e --argjson bot "$bot" --arg head "$head" --arg marker "$marker" \
            --arg legacy "$legacy_marker" --arg retarget_at "$retarget_at" '
            any(.[][]; .user.id == $bot and .commit_id == $head and .state == "COMMENTED" and
              ((.body // "") as $body | ($body | contains($marker)) or
                (($body | contains($legacy)) and ($retarget_at == "" or (.submitted_at // "") > $retarget_at)))) | not
          ' <<< "$reviews" >/dev/null || exit 0

          # A completed dispatch job can leave Claude working after the concurrency lock releases.
          # A new base, ready transition, or qualifying request can replace a stopped review.
          scope=$(printf '%s\0%s\0%s' "$base_ref" "$request_id" "$lifecycle_id" | sha256sum)
          scope=${scope%% *}
          claim="kedifybot-review-$pr-$head-$scope"

          review_attempts() {
            github_api --paginate --slurp --method GET "repos/$repo/actions/runs/$1/jobs" \
              -f filter=all -F per_page=100 |
              jq -c --arg dispatch "Start Claude review $scope" '
                (now - 86400 | todateiso8601) as $cutoff | [.[].jobs[]] as $jobs |
                {complete: ($jobs | length > 0 and all(.[]; .status == "completed" and (.steps | type == "array" and length > 0))),
                 held: any($jobs[];
                   any(.steps[]?; .name == $dispatch and .started_at >= $cutoff and .conclusion != "skipped") and
                   all(.steps[]?; .name != "Release rejected review claim" or .conclusion != "success"))}
              '
          }

          artifacts=$(github_api --paginate --slurp --method GET "repos/$repo/actions/artifacts" \
            -f name="$claim" -F per_page=100)
          claims=$(jq -r --arg claim "$claim" '
            .[].artifacts[] | select(.name == $claim and .expired == false) |
            [.id, .workflow_run.id] | @tsv
          ' <<< "$artifacts")
          while IFS=$'\t' read -r artifact run; do
            [[ -n "$artifact" ]] || continue
            [[ "$artifact" =~ ^[1-9][0-9]*$ && "$run" =~ ^[1-9][0-9]*$ ]] || exit 1
            origin=$(github_api "repos/$repo/actions/runs/$run")
            jq -e --arg repo "$repo" '
              .repository.full_name == $repo and .event == "pull_request_target" and
              (.path | split("@")[0]) == ".github/workflows/kedifybot-review.yml"
            ' <<< "$origin" >/dev/null || continue

            # A receipt releases only the exact claim from the same run.
            receipt="kedifybot-review-rejected-$artifact"
            receipts=$(github_api --paginate --slurp --method GET "repos/$repo/actions/runs/$run/artifacts" \
              -f name="$receipt" -F per_page=100)
            jq -e --arg receipt "$receipt" '
              any(.[].artifacts[]; .name == $receipt and .expired == false)
            ' <<< "$receipts" >/dev/null && continue

            # A completed job that never reached dispatch can leave an unused claim.
            if jq -e '.status == "completed" and .conclusion != "success"' <<< "$origin" >/dev/null; then
              attempts=$(review_attempts "$run")
              jq -e '.complete and (.held | not)' <<< "$attempts" >/dev/null && continue
            fi
            echo 'This PR head already has a Claude review claim.'
            exit 0
          done <<< "$claims"

          # GitHub can discard artifacts when rerunning the same workflow run.
          if (( GITHUB_RUN_ATTEMPT > 1 )); then
            attempts=$(review_attempts "$GITHUB_RUN_ID")
            if jq -e '.held' <<< "$attempts" >/dev/null; then
              echo 'An earlier attempt may already have started a Claude review.'
              printf 'claim=%s\nscope=%s\n' "$claim" "$scope" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          payload=$(jq -nc --arg repo "$repo" --arg action "$action" --argjson pr "$pr" \
            --arg head "$head" --arg baseRef "$base_ref" --arg requestId "$request_id" \
            --argjson lifecycleId "$lifecycle_id" '
            {text: ({version: 3, $repo, $action, $pr, $head, $baseRef, $lifecycleId,
              requestId: (if $requestId == "" then null else $requestId end)} | tojson)}
          ')
          printf 'claim=%s\nscope=%s\npayload=%s\n' "$claim" "$scope" "$payload" >> "$GITHUB_OUTPUT"

      - name: Prepare review claim
        if: steps.gate.outputs.claim != ''
        env:
          KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_ID: ${{ secrets.KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_ID }}
          KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_TOKEN: ${{ secrets.KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_TOKEN }}
          KEDIFY_PUBLIC_REPO_REVIEW_PAYLOAD: ${{ steps.gate.outputs.payload }}
        run: |
          set -euo pipefail
          if [[ -n $KEDIFY_PUBLIC_REPO_REVIEW_PAYLOAD &&
                ( ! $KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_ID =~ ^trig_[A-Za-z0-9]+$ ||
                -z $KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_TOKEN ) ]]; then
            echo 'The Claude routine ID or token is missing from this run.' >&2
            exit 1
          fi
          printf 'Claude review claimed\n' > "$RUNNER_TEMP/kedifybot-review-claim.txt"

      - name: Reserve this PR head
        id: reserve
        if: steps.gate.outputs.claim != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.gate.outputs.claim }}
          path: ${{ runner.temp }}/kedifybot-review-claim.txt
          retention-days: 1
          if-no-files-found: error
          overwrite: true

      - name: Start Claude review ${{ steps.gate.outputs.scope }}
        id: dispatch
        if: steps.gate.outputs.payload != ''
        env:
          KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_ID: ${{ secrets.KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_ID }}
          KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_TOKEN: ${{ secrets.KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_TOKEN }}
          KEDIFY_PUBLIC_REPO_REVIEW_PAYLOAD: ${{ steps.gate.outputs.payload }}
        run: |
          set -euo pipefail
          routine_id=$KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_ID
          routine_token=$KEDIFY_PUBLIC_REPO_REVIEW_CLAUDE_ROUTINE_TOKEN
          if status=$(curl --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --header @<(printf 'Authorization: Bearer %s\n' "$routine_token") \
              --header 'anthropic-version: 2023-06-01' \
              --header 'anthropic-beta: experimental-cc-routine-2026-04-01' \
              --header 'content-type: application/json' --data-binary @- \
              "https://api.anthropic.com/v1/claude_code/routines/$routine_id/fire" \
              <<< "$KEDIFY_PUBLIC_REPO_REVIEW_PAYLOAD"); then
            case "$status" in
              200) exit 0 ;;
              # The Routine API documents these as rejected requests.
              400|401|403|404|429) printf 'rejected=true\n' >> "$GITHUB_OUTPUT" ;;
            esac
            echo "::error::Claude Routine dispatch returned HTTP $status."
          else
            echo '::error::Claude Routine dispatch failed before its outcome could be confirmed.'
          fi
          exit 1

      - name: Release rejected review claim
        if: failure() && steps.dispatch.outputs.rejected == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kedifybot-review-rejected-${{ steps.reserve.outputs.artifact-id }}
          path: ${{ runner.temp }}/kedifybot-review-claim.txt
          retention-days: 1
          if-no-files-found: error
