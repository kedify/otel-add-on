{{- $ha := .Values.settings.ha | default dict -}}
{{- if .Values.deployScaler }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.name | default .Values.fullnameOverride | default .Release.Name }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "otel-add-on.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    {{- if not $ha.enabled }}
    - port: {{ .Values.service.otlpReceiverPort }}
      targetPort: {{ .Values.service.otlpReceiverPort }}
      protocol: TCP
      name: grpc-otlp-receiver
    {{- end }}
    - port: {{ .Values.service.kedaExternalScalerPort }}
      targetPort: {{ .Values.service.kedaExternalScalerPort }}
      protocol: TCP
      name: keda-external-scaler
    - port: {{ .Values.settings.internalMetricsPort }}
      targetPort: {{ .Values.settings.internalMetricsPort }}
      protocol: TCP
      name: internal-metrics
    - port: {{ .Values.settings.restApiPort }}
      targetPort: {{ .Values.settings.restApiPort }}
      protocol: TCP
      name: rest-api
    {{- if .Values.settings.profiling.enabled }}
    - port: {{ .Values.settings.profiling.port }}
      targetPort: {{ .Values.settings.profiling.port }}
      protocol: TCP
      name: profiler
    {{- end }}
  selector:
    {{- include "otel-add-on.selectorLabels" . | nindent 4 }}
{{- if $ha.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "otel-add-on.headlessServiceName" . }}
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    {{- include "otel-add-on.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - port: {{ .Values.service.otlpReceiverPort }}
      targetPort: {{ .Values.service.otlpReceiverPort }}
      protocol: TCP
      name: grpc-otlp-receiver
  selector:
    {{- include "otel-add-on.selectorLabels" . | nindent 4 }}
{{- end }}
{{- end }}
